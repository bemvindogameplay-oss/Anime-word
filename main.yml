name: Build ANIME WORD APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare web files
        run: |
          mkdir -p www
          for file in index.html admin.html LEIA-ME.txt manifest.json sw.js icon-192.png icon-512.png anime-word-poster.png anime-word-poster.jpg; do
            if [ -f "$file" ]; then
              cp "$file" www/
            fi
          done

          if [ -d assets ]; then
            cp -r assets www/
          fi

          if [ -d covers ]; then
            cp -r covers www/
          fi

      - name: Install dependencies
        run: npm install

      - name: Build APK
        run: |
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anime-word-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
