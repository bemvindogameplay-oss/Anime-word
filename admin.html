<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Administração — Anime Word</title><style>:root{--bg:#090909;--panel:#151515;--gold:#d9ad45;--gold2:#ffdf80}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8f4e9;font-family:system-ui,sans-serif}.wrap{max-width:700px;margin:auto;padding:20px}.brand{font-size:28px;font-weight:900;color:var(--gold2)}.card{margin-top:20px;background:#151515;border:1px solid #302714;border-radius:15px;padding:18px}label{display:block;color:#ffdf80;font-size:13px;margin:13px 0 6px}input,textarea,select{width:100%;padding:12px;border-radius:9px;border:1px solid #40351f;background:#0b0b0b;color:white;font:inherit}textarea{min-height:110px;resize:vertical}button,.link{display:inline-block;margin-top:14px;padding:11px 14px;border-radius:9px;background:#d9ad45;color:#111;border:0;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#211b0e;color:#ffdf80;border:1px solid #4a3b1a}.hint{font-size:12px;color:#aaa;line-height:1.5}.item{padding:12px 0;border-bottom:1px solid #302714}.item b{display:block}.item small{color:#aaa}.danger{background:#3b1717;color:#ffd0d0}</style></head><body><main class="wrap"><div class="brand">👑 ANIME WORD</div><h2>Painel de administração</h2><p class="hint">Esta versão guarda publicações apenas neste navegador/dispositivo. Não é um painel online seguro: antes de publicar para todos os utilizadores, será necessário autenticação e uma base de dados no servidor.</p><section class="card"><form id="form"><label for="anime">Anime</label><input id="anime" required placeholder="Ex.: One Piece"><label for="title">Título da notícia</label><input id="title" required maxlength="140" placeholder="Escreve um título claro"><label for="desc">Resumo</label><textarea id="desc" required maxlength="1200" placeholder="Resume a informação e inclui contexto"></textarea><label for="kind">Tipo de anúncio</label><select id="kind"><option>Episódio</option><option>Temporada</option><option>Filme</option><option>Novo anime</option><option>Novo projeto</option></select><label for="status">Estado de verificação</label><select id="status"><option value="confirmed">Confirmada — indicar fonte oficial no resumo</option><option value="rumor">Rumor — não confirmado</option><option value="unverified">Por verificar</option></select><label for="source">Fonte / ligação (opcional nesta demonstração)</label><input id="source" type="url" placeholder="https://..."><button type="submit">Publicar notícia neste dispositivo</button></form><p id="msg" class="hint"></p></section><section class="card"><h3>Publicações locais</h3><div id="list"></div><button class="secondary" id="clear">Apagar publicações locais</button></section><a class="link secondary" href="index.html">← Voltar à aplicação</a></main><script>const key='aw_custom_news';function get(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}}function render(){let a=get();document.getElementById('list').innerHTML=a.length?a.map(n=>`<div class="item"><b>${esc(n.title)}</b><small>${esc(n.anime)} · ${esc(n.kind)} · ${esc(n.type)} · ${esc(n.date)}</small><p>${esc(n.desc)}</p>${n.source?`<a class="hint" href="${esc(n.source)}" target="_blank" rel="noopener">Abrir fonte</a>`:''}<br><button class="danger" onclick="del(${n.id})">Apagar</button></div>`).join(''):'<p class="hint">Ainda não existem publicações manuais.</p>'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('form').onsubmit=e=>{e.preventDefault();let a=get();a.unshift({id:Date.now(),anime:anime.value.trim(),title:title.value.trim(),desc:desc.value.trim(),kind:kind.value,type:status.value,source:source.value.trim(),date:new Date().toLocaleDateString('pt-PT')});localStorage.setItem(key,JSON.stringify(a));form.reset();msg.textContent='Publicação guardada neste dispositivo. Ainda não foi enviada a outros utilizadores.';render()};window.del=id=>{localStorage.setItem(key,JSON.stringify(get().filter(n=>n.id!==id)));render()};document.getElementById('clear').onclick=()=>{if(confirm('Apagar todas as publicações manuais deste dispositivo?')){localStorage.removeItem(key);render()}};render();</script></body></html>
